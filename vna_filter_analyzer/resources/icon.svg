<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- S21 Curve Glow Gradient -->
    <linearGradient id="s21Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    
    <!-- Shaded Passband Gradient -->
    <linearGradient id="passbandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.02"/>
    </linearGradient>

    <!-- S11 Curve Gradient -->
    <linearGradient id="s11Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e74c3c"/>
    </linearGradient>

    <!-- Filter Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Instrument Grid Lines -->
  <g stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="64" y1="120" x2="448" y2="120"/>
    <line x1="64" y1="180" x2="448" y2="180"/>
    <line x1="64" y1="240" x2="448" y2="240"/>
    <line x1="64" y1="300" x2="448" y2="300"/>
    <line x1="64" y1="360" x2="448" y2="360"/>
    <line x1="64" y1="420" x2="448" y2="420"/>

    <line x1="128" y1="80" x2="128" y2="440"/>
    <line x1="192" y1="80" x2="192" y2="440"/>
    <line x1="256" y1="80" x2="256" y2="440"/>
    <line x1="320" y1="80" x2="320" y2="440"/>
    <line x1="384" y1="80" x2="384" y2="440"/>
  </g>

  <!-- Outer Display Frame -->
  <rect x="64" y="80" width="384" height="350" rx="8" fill="none" stroke="#475569" stroke-width="2.5"/>

  <!-- Shaded Passband Region (fL to fH) -->
  <polygon points="190,430 190,165 322,165 322,430" fill="url(#passbandGrad)"/>

  <!-- Cutoff Marker Lines (fL and fH) -->
  <line x1="190" y1="80" x2="190" y2="430" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="322" y1="80" x2="322" y2="430" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Center Frequency Marker (Fc) -->
  <line x1="256" y1="80" x2="256" y2="430" stroke="#ef4444" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- -3 dB Horizontal Line -->
  <line x1="64" y1="165" x2="448" y2="165" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- S11 Reflection Curve (V-dip at resonance) -->
  <path d="M 70,120 C 130,125 180,150 220,240 C 240,310 256,410 256,410 C 256,410 272,310 292,240 C 332,150 382,125 442,120"
        fill="none" stroke="url(#s11Grad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

  <!-- S21 Transmission Bandpass Curve -->
  <path d="M 70,410 C 130,405 170,390 190,165 C 205,125 230,110 256,110 C 282,110 307,125 322,165 C 342,390 382,405 442,410"
        fill="none" stroke="url(#s21Grad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Peak Dot Marker -->
  <circle cx="256" cy="110" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>

  <!-- R&S Aesthetic Badge / Text -->
  <rect x="74" y="90" width="80" height="22" rx="4" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2"/>
  <text x="114" y="105" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">S21 BPF</text>

  <rect x="360" y="90" width="78" height="22" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="399" y="105" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Fc 3.5G</text>
</svg>
